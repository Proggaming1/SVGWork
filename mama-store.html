<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama Food Store - SVGWork</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .store-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .store-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .store-panel h3 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .product-emoji {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .product-price {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .product-qty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .product-qty input {
            width: 40px;
            padding: 5px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }

        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }

        .btn-add:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1em;
            color: #667eea;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 2px solid #667eea;
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }

        .btn-checkout:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .store-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>🍽️ Mama Food Store</h1>
            <button onclick="goToDashboard()" class="btn-back">← Back to Dashboard</button>
        </header>

        <div class="store-section">
            <!-- Mama Panel -->
            <div class="store-panel" id="mama-panel" style="display:none;">
                <h3>👩 Mama - Manage Menu</h3>
                <div class="form-group">
                    <label>Food Name</label>
                    <input type="text" id="food-name" placeholder="e.g., Nasi Goreng">
                </div>
                <div class="form-group">
                    <label>Price (Rp)</label>
                    <input type="number" id="food-price" placeholder="10000" min="0">
                </div>
                <div class="form-group">
                    <label>Emoji/Icon</label>
                    <input type="text" id="food-emoji" placeholder="🍛" maxlength="2">
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" id="food-stock" placeholder="50" min="0">
                </div>
                <button class="btn btn-primary" onclick="addFoodItem()">➕ Add Menu Item</button>

                <h4 style="margin-top: 30px; margin-bottom: 15px;">📋 Menu List</h4>
                <div class="product-grid" id="mama-menu-list"></div>
            </div>

            <!-- Child Panel -->
            <div class="store-panel" id="child-panel" style="display:none;">
                <h3>👶 Order Food</h3>
                <div class="product-grid" id="menu-list"></div>
                <div class="order-summary">
                    <div class="order-item">
                        <span>Orders:</span>
                        <span id="order-count">0</span>
                    </div>
                    <div class="order-total">
                        <span>Total:</span>
                        <span id="order-total">Rp 0</span>
                    </div>
                    <button class="btn-checkout" onclick="checkoutOrder()">🛒 Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="mama-store.js"></script>
</body>
</html>
