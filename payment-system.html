<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment System - SVGWork</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .payment-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .wallet-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .wallet-card h2 {
            font-size: 1.1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .balance-amount {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .balance-info {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.9em;
        }

        .transaction-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .transaction-item.income {
            border-left-color: #28a745;
        }

        .transaction-item.expense {
            border-left-color: #dc3545;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-title {
            font-weight: 600;
            color: #333;
        }

        .transaction-date {
            font-size: 0.9em;
            color: #999;
        }

        .transaction-amount {
            font-size: 1.1em;
            font-weight: 700;
        }

        .amount-income {
            color: #28a745;
        }

        .amount-expense {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>💰 Payment System</h1>
            <button onclick="goToDashboard()" class="btn-back">← Back to Dashboard</button>
        </header>

        <div class="payment-container">
            <!-- Child Wallet -->
            <div class="wallet-card" id="child-wallet" style="display:none;">
                <h2>👶 My Wallet</h2>
                <div class="balance-amount" id="child-balance">Rp 0</div>
                <div class="balance-info">
                    <div>
                        <div style="opacity: 0.8;">Income</div>
                        <div style="font-size: 1.1em; font-weight: 600;" id="child-income">Rp 0</div>
                    </div>
                    <div>
                        <div style="opacity: 0.8;">Expenses</div>
                        <div style="font-size: 1.1em; font-weight: 600;" id="child-expenses">Rp 0</div>
                    </div>
                </div>
            </div>

            <!-- Parent Wallet -->
            <div class="wallet-card" id="parent-wallet" style="display:none;">
                <h2>👨‍👩‍👧‍👦 Children Status</h2>
                <div id="children-status"></div>
            </div>
        </div>

        <div class="transaction-panel" style="margin-top: 30px;">
            <h3>📊 Transaction History</h3>
            <div class="transaction-list" id="transaction-list"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="payment-system.js"></script>
</body>
</html>
