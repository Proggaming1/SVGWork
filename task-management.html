<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas - SVGWork</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .header h1 { color: #667eea; font-size: 2em; }
        .back-btn, .logout-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn { background: #ff6b6b; }
        .content {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .form-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            color: white;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
        }
        .btn-submit {
            background: #ffd93d;
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .task-card {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 25px;
            border-radius: 15px;
        }
        .task-reward {
            background: #ffd93d;
            color: #333;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Manajemen Tugas</h1>
            <div style="display: flex; gap: 15px;">
                <button class="back-btn" onclick="goBack()">← Kembali</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
        <div class="content">
            <h2 style="color: #333; margin-bottom: 30px;">📋 Kelola Tugas Anak</h2>
            <div class="form-section">
                <h3 style="margin-bottom: 20px;">➕ Buat Tugas Baru</h3>
                <div class="form-group"><label>Nama Tugas</label><input type="text" id="task-name" placeholder="Misal: Bersihkan Kamar"></div>
                <div class="form-group"><label>Deskripsi</label><textarea id="task-desc" placeholder="Jelaskan tugas..."></textarea></div>
                <div class="form-group"><label>Reward (Rp)</label><input type="number" id="task-reward" placeholder="100000"></div>
                <div class="form-group"><label>Deadline</label><input type="date" id="task-deadline"></div>
                <button class="btn-submit" onclick="createTask()">✨ Buat Tugas</button>
            </div>
            <h3 style="margin-bottom: 20px; color: #333;">📋 Daftar Tugas</h3>
            <div class="tasks-grid">
                <div class="task-card">
                    <h3>Bersihkan Kamar</h3>
                    <p>Rapikan semua mainan dan bersihkan lantai</p>
                    <div class="task-reward">Rp 100.000</div>
                </div>
                <div class="task-card">
                    <h3>Belajar Matematika</h3>
                    <p>Selesaikan latihan bab 5</p>
                    <div class="task-reward">Rp 150.000</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function createTask() { alert('✅ Tugas berhasil dibuat'); }
        function goBack() { window.location.href = 'main-dashboard.html'; }
        function logout() {
            if (confirm('Logout?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
