<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGWork - Family Economy Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            font-size: 1.1em;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 40px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .demo-accounts {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
            border-left: 4px solid #667eea;
        }

        .demo-accounts strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
        }

        .demo-accounts p {
            margin: 5px 0;
        }

        @media (max-width: 600px) {
            .login-box {
                border-radius: 0;
            }
            .login-header {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 2em;
            }
            .tab-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🏠 SVGWork</h1>
                <p>Family Economy Management</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="parent">👨‍👩 Parent</button>
                <button class="tab-btn" data-tab="child">👧👦 Child</button>
            </div>

            <!-- Parent Login Tab -->
            <div class="tab-content active" id="parent-tab">
                <div class="error-message" id="parent-error"></div>
                <div class="success-message" id="parent-success"></div>
                <form id="parent-login-form">
                    <div class="form-group">
                        <label for="parent-email">📧 Email</label>
                        <input type="email" id="parent-email" placeholder="papa@svgwork.com" required>
                    </div>
                    <div class="form-group">
                        <label for="parent-password">🔐 Password</label>
                        <input type="password" id="parent-password" placeholder="Papa12345!" required>
                    </div>
                    <button type="submit" class="btn btn-primary">🔓 Login as Parent</button>
                </form>
                <div class="demo-accounts">
                    <strong>💡 Demo Accounts:</strong>
                    <p>📧 papa@svgwork.com | 🔐 Papa12345!</p>
                    <p>📧 mama@svgwork.com | 🔐 Mama12345!</p>
                </div>
            </div>

            <!-- Child Login Tab -->
            <div class="tab-content" id="child-tab">
                <div class="error-message" id="child-error"></div>
                <div class="success-message" id="child-success"></div>
                <form id="child-login-form">
                    <div class="form-group">
                        <label for="child-email">📧 Email</label>
                        <input type="email" id="child-email" placeholder="anak1@svgwork.com" required>
                    </div>
                    <div class="form-group">
                        <label for="child-password">🔐 Password</label>
                        <input type="password" id="child-password" placeholder="Anak12345!" required>
                    </div>
                    <button type="submit" class="btn btn-primary">🔓 Login as Child</button>
                </form>
                <div class="demo-accounts">
                    <strong>💡 Demo Accounts:</strong>
                    <p>📧 anak1@svgwork.com | 🔐 Anak12345!</p>
                    <p>📧 anak2@svgwork.com | 🔐 Anak22345!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== DEMO ACCOUNTS DATABASE =====
        const demoAccounts = {
            parent: [
                { email: 'papa@svgwork.com', password: 'Papa12345!', name: 'Papa' },
                { email: 'mama@svgwork.com', password: 'Mama12345!', name: 'Mama' }
            ],
            child: [
                { email: 'anak1@svgwork.com', password: 'Anak12345!', name: 'Anak 1' },
                { email: 'anak2@svgwork.com', password: 'Anak22345!', name: 'Anak 2' }
            ]
        };

        // ===== TAB NAVIGATION =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.target.getAttribute('data-tab');
                
                // Remove active from all
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active to clicked
                e.target.classList.add('active');
                document.getElementById(tab + '-tab').classList.add('active');
            });
        });

        // ===== PARENT LOGIN HANDLER =====
        document.getElementById('parent-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('parent-email').value.trim();
            const password = document.getElementById('parent-password').value;
            const errorDiv = document.getElementById('parent-error');
            const successDiv = document.getElementById('parent-success');
            const btn = this.querySelector('button[type="submit"]');
            
            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validate demo account
            const account = demoAccounts.parent.find(acc => acc.email === email && acc.password === password);
            
            if (account) {
                // Success
                localStorage.setItem('userRole', 'parent');
                localStorage.setItem('userId', email);
                localStorage.setItem('userName', account.name);
                
                successDiv.textContent = '✅ Login Berhasil! Redirecting...';
                successDiv.style.display = 'block';
                btn.textContent = '✅ Login Berhasil...';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'main-dashboard.html';
                }, 1500);
            } else {
                // Failed
                errorDiv.textContent = '❌ Email atau password salah!';
                errorDiv.style.display = 'block';
                document.getElementById('parent-password').value = '';
            }
        });

        // ===== CHILD LOGIN HANDLER =====
        document.getElementById('child-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('child-email').value.trim();
            const password = document.getElementById('child-password').value;
            const errorDiv = document.getElementById('child-error');
            const successDiv = document.getElementById('child-success');
            const btn = this.querySelector('button[type="submit"]');
            
            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validate demo account
            const account = demoAccounts.child.find(acc => acc.email === email && acc.password === password);
            
            if (account) {
                // Success
                localStorage.setItem('userRole', 'child');
                localStorage.setItem('userId', email);
                localStorage.setItem('userName', account.name);
                
                successDiv.textContent = '✅ Login Berhasil! Redirecting...';
                successDiv.style.display = 'block';
                btn.textContent = '✅ Login Berhasil...';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'main-dashboard.html';
                }, 1500);
            } else {
                // Failed
                errorDiv.textContent = '❌ Email atau password salah!';
                errorDiv.style.display = 'block';
                document.getElementById('child-password').value = '';
            }
        });
    </script>
</body>
</html>
