<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGWork - Family Economy Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>SVGWork</h1>
            <p class="subtitle">Family Economy Management System</p>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="parent">Parent</button>
                <button class="tab-btn" data-tab="child">Child</button>
            </div>

            <div class="tab-content active" id="parent-tab">
                <form id="parent-login-form">
                    <div class="form-group">
                        <label for="parent-email">Email</label>
                        <input type="email" id="parent-email" placeholder="parent@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="parent-password">Password</label>
                        <input type="password" id="parent-password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login as Parent</button>
                </form>
            </div>

            <div class="tab-content" id="child-tab">
                <form id="child-login-form">
                    <div class="form-group">
                        <label for="child-email">Email</label>
                        <input type="email" id="child-email" placeholder="child@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="child-password">Password</label>
                        <input type="password" id="child-password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login as Child</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
